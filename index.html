<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호르메 몬테소리 부모교육 | 신청</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
      background: #f5f1ed;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    .wrap {
      background: #fff;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      border-radius: 8px;
      padding: 44px 32px 48px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    }

    .head { text-align: center; margin-bottom: 30px; }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #8B1A1A;
      background: #fdf3f3;
      border: 1px solid #e8c8c8;
      border-radius: 20px;
      padding: 5px 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle { font-size: 14px; color: #888; line-height: 1.6; }

    .round {
      border: 1px solid #e8e0d8;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .round-h {
      background: #faf6f2;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 800;
      color: #8B1A1A;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .round-h .start { font-weight: 500; color: #999; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; padding: 14px; }

    .course-btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.15s;
      text-align: left;
    }

    .course-btn.open { background: #8B1A1A; color: #fff; }
    .course-btn.open:hover { background: #6e1414; }

    .course-btn.closed {
      background: #f2f2f2;
      color: #999;
      cursor: default;
      opacity: 0.7;
    }

    .course-btn.waiting {
      background: #fff;
      border-color: #d8d0c8;
      color: #8a7f70;
      cursor: default;
    }

    .course-btn .btn-title {
      font-size: 16px;
      font-weight: 800;
      display: block;
      margin-bottom: 3px;
      letter-spacing: -0.3px;
    }
    .course-btn .btn-desc {
      font-size: 12.5px;
      font-weight: 400;
      opacity: 0.85;
      display: block;
    }
    .course-btn .arrow { float: right; font-size: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="badge">전체 기수 모집중</div>
      <h1>호르메 몬테소리<br>부모교육</h1>
      <p class="subtitle">줌(ZOOM) 소그룹 공동구매 수업<br>원하시는 개강일을 선택해 신청해 주세요</p>
    </div>

    <div id="rounds"></div>
  </div>

<script>
/* ===== 기수 데이터 — 날짜/마감 수정은 여기서 ===== */
var ROUNDS = [
  { no: 3, label: '3기', basic: { day:'목', time:'야간 9시~12시', start:'2026-07-23', startLabel:'7/23(목)', status:'closed' },
                          sensory: { day:'금', time:'야간 9시~12시', start:'2026-07-24', startLabel:'7/24(금)', status:'closed' } },
  { no: 4, label: '4기', basic: { day:'금', time:'오전 10:30~1:30', start:'2026-08-21', startLabel:'8/21(금)', status:'open' },
                          sensory: { day:'목', time:'야간 9시~12시', start:'2026-08-20', startLabel:'8/20(목)', status:'open' } },
  { no: 5, label: '5기', basic: { day:'목', time:'야간 9시~12시', start:'2026-09-17', startLabel:'9/17(목)', status:'waiting' },
                          sensory: { day:'금', time:'오전 10:30~1:30', start:'2026-09-18', startLabel:'9/18(금)', status:'waiting' } },
  { no: 6, label: '6기', basic: { day:'금', time:'오전 10:30~1:30', start:'2026-10-23', startLabel:'10/23(금)', status:'waiting' },
                          sensory: { day:'목', time:'야간 9시~12시', start:'2026-10-22', startLabel:'10/22(목)', status:'waiting' } },
  { no: 7, label: '7기', basic: { day:'목', time:'야간 9시~12시', start:'2026-11-19', startLabel:'11/19(목)', status:'waiting' },
                          sensory: { day:'금', time:'오전 10:30~1:30', start:'2026-11-20', startLabel:'11/20(금)', status:'waiting' } }
];

function courseBtn(round, courseKey, courseName) {
  var c = round[courseKey];
  if (c.status === 'closed') {
    return '<span class="course-btn closed">'
      + '<span class="arrow">✕</span>'
      + '<span class="btn-title">' + courseName + ' — 마감되었습니다</span>'
      + '<span class="btn-desc">신청이 마감되었습니다. 다음 기수를 기대해 주세요.</span>'
      + '</span>';
  }
  if (c.status === 'waiting') {
    return '<span class="course-btn waiting">'
      + '<span class="arrow">⏳</span>'
      + '<span class="btn-title">' + courseName + ' — 신청 대기중</span>'
      + '<span class="btn-desc">' + c.day + '요일 ' + c.time + ' · ' + c.startLabel + ' 시작 · 오픈 시 안내드립니다</span>'
      + '</span>';
  }
  var href = 'apply.html?round=' + round.no + '&course=' + courseKey;
  return '<a href="' + href + '" class="course-btn open" id="btn-' + round.no + '-' + courseKey + '">'
    + '<span class="arrow">→</span>'
    + '<span class="btn-title">' + courseName + ' 신청하기</span>'
    + '<span class="btn-desc">' + c.day + '요일 ' + c.time + ' · ' + c.startLabel + ' 시작 · 총 4회차</span>'
    + '</a>';
}

var el = document.getElementById('rounds');
ROUNDS.forEach(function(r) {
  var div = document.createElement('div');
  div.className = 'round';
  div.innerHTML = '<div class="round-h"><span>' + r.label + '</span><span class="start">개강 ' + r.basic.startLabel.split('(')[0] + '~' + r.sensory.startLabel.split('(')[0] + '</span></div>'
    + '<div class="btn-group">' + courseBtn(r, 'basic', '기본교육') + courseBtn(r, 'sensory', '감각교육') + '</div>';
  el.appendChild(div);
});

/* 기수·과정별 실시간 마감 여부 확인 (정원 40명 도달 시 자동 마감 표시) */
var COURSE_NAME = { basic: '기본교육', sensory: '감각교육' };
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXFtHC26Ak7YaiK1wl51SYZIgzQ7qYI6lanQtnYK3hrKdedfy5po0vqTz4ozteqHe0/exec';
fetch(SCRIPT_URL)
  .then(function(r){ return r.json(); })
  .then(function(d){
    ROUNDS.forEach(function(r){
      ['basic','sensory'].forEach(function(courseKey){
        var key = r.label + '_' + COURSE_NAME[courseKey];
        if (d[key] && d[key].closed) {
          var btn = document.getElementById('btn-' + r.no + '-' + courseKey);
          if (btn) btn.outerHTML = '<span class="course-btn closed"><span class="arrow">✕</span><span class="btn-title">' + COURSE_NAME[courseKey] + ' — 마감되었습니다</span><span class="btn-desc">신청이 마감되었습니다. 다음 기수를 기대해 주세요.</span></span>';
        }
      });
    });
  })
  .catch(function(){});
</script>
</body>
</html>
